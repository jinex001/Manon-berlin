# Bei jedem Push auf main wird die Website per FTP (mit TLS) auf den
# All-Inkl-Server hochgeladen. Es werden nur geänderte Dateien übertragen.
#
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    z. B. w0123456.kasserver.com
#   FTP_USERNAME  FTP-Benutzer aus dem KAS (am besten ein eigener, auf den Website-Ordner beschränkt)
#   FTP_PASSWORD  Passwort dieses FTP-Benutzers
# Optional:
#   FTP_SERVER_DIR  Zielordner auf dem Server, Standard ./ (mit abschließendem /)

name: Deploy (All-Inkl FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Hinweis, falls Secrets fehlen
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP_SERVER ist nicht gesetzt – Deployment übersprungen."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Per FTP hochladen
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
